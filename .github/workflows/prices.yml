name: Atualiza preços BR (Caos Ascendente)
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  precos:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Rodar o robô de preços
        run: python3 scripts/scrape_prices.py
      - name: Commitar se o preço mudou
        run: |
          if [ -n "$(git status --porcelain prices.json)" ]; then
            git config user.name "prices-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add prices.json
            git commit -m "chore: atualiza precos BR ($(date -u +%F))"
            git push
            echo "Precos atualizados."
          else
            echo "Sem mudanca hoje."
          fi
